<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>设计月度规划</title>
    <link rel="icon" href="./favicon.ico" sizes="any" />
    <link rel="icon" href="./favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="stylesheet" href="./styles.css?v=20261023" />
  </head>
  <body class="menu-collapsed theme-fresh">
    <div class="app-shell">
      <aside class="sidebar" aria-label="计划设置">
        <button class="sidebar-toggle" id="sidebarToggle" type="button" aria-expanded="false" title="展开设置">
          <span class="toggle-icon">☰</span>
          <span class="toggle-label">设置</span>
        </button>

        <div class="brand">
          <p class="eyebrow">2026</p>
          <h1>设计月度规划</h1>
          <p class="access-note" id="accessNote"></p>
          <p>按月份填写每天任务，数据会自动保存在当前浏览器。</p>
        </div>

        <section class="panel month-panel" aria-label="月份选择">
          <div class="panel-title">
            <span>月份</span>
            <button class="icon-button" id="todayButton" type="button" title="回到当前月份">今</button>
          </div>
          <div class="month-grid" id="monthGrid"></div>
        </section>

        <section class="panel" aria-label="项目库">
          <div class="panel-title">
            <span>项目库</span>
          </div>
          <div class="project-list" id="projectList"></div>
          <form class="project-form" id="projectForm">
            <input id="projectNameInput" type="text" placeholder="新增项目名称" autocomplete="off" />
            <input id="projectColorInput" type="color" value="#70d900" title="选择项目颜色" />
            <button type="submit">添加</button>
          </form>
        </section>

        <section class="panel compact-actions" aria-label="数据操作">
          <select class="data-action-select" id="dataActionSelect" aria-label="选择数据操作">
            <option value="">数据操作</option>
            <option value="export-data">导出数据</option>
            <option value="export-html">导出HTML</option>
            <option value="export-image">导出图片</option>
            <option value="export-package">导出最新整包</option>
            <option value="copy-excel">复制到Excel</option>
            <option value="import-data">导入数据</option>
          </select>
          <div class="data-action-targets" hidden>
            <button type="button" id="exportButton">导出数据</button>
            <button type="button" id="exportHtmlButton">导出HTML</button>
            <button type="button" id="exportImageButton">导出图片</button>
            <button type="button" id="exportPackageButton">导出最新整包</button>
            <button type="button" id="copyExcelButton">复制到Excel</button>
          </div>
          <input type="file" id="importInput" accept="application/json" hidden />
        </section>
      </aside>

      <main class="workspace">
        <header class="topbar">
          <div>
            <h2 id="monthTitle">8 月</h2>
          </div>
          <button class="queue-list-button" type="button" id="queueListOpenButton">
            <span>排队列表</span>
            <strong id="queueListCount" aria-label="0 个排队取号">0</strong>
          </button>
          <div class="month-controls" aria-label="月份切换">
            <button type="button" id="prevMonth">上一月</button>
            <button type="button" id="nextMonth">下一月</button>
          </div>
          <div class="topbar-tools" aria-label="批量选择">
            <button class="queue-open-button" type="button" id="queueOpenButton">排队取号</button>
            <button type="button" id="batchToggle">多选</button>
            <button type="button" id="clearSelectionButton">清空选中</button>
          </div>
        </header>

        <section class="calendar-card" aria-label="月度日历">
          <div class="weekday-row" aria-hidden="true">
            <span>星期一</span>
            <span>星期二</span>
            <span>星期三</span>
            <span>星期四</span>
            <span>星期五</span>
            <span>星期六</span>
            <span>星期日</span>
          </div>
          <div class="calendar-grid" id="calendarGrid"></div>
        </section>
      </main>

      <aside class="editor" aria-label="当天任务编辑">
        <div class="editor-header">
          <div>
            <p class="eyebrow">Selected Day</p>
            <h2 id="selectedDateTitle">选择一天</h2>
          </div>
          <button class="icon-button" id="closeEditor" type="button" title="关闭编辑区">×</button>
        </div>

        <div class="day-summary" id="daySummary">点击日历中的日期后，在这里填写当天任务。</div>

        <form class="task-form" id="taskForm">
          <label for="taskInput">任务</label>
          <div class="task-input-row">
            <input id="taskInput" type="text" list="projectSuggestions" placeholder="例如 Deepclaw / 官网 / 请假" autocomplete="off" />
            <button type="submit">添加</button>
          </div>
          <datalist id="projectSuggestions"></datalist>
        </form>

        <div class="task-list" id="taskList"></div>

        <div class="editor-actions">
          <button type="button" id="clearDayButton">清空当天</button>
        </div>
      </aside>
    </div>

    <dialog class="viewer-dialog" id="viewerDialog" aria-labelledby="viewerDialogTitle">
      <div class="viewer-dialog-header">
        <div>
          <p class="viewer-dialog-kicker">今日任务</p>
          <h2 id="viewerDialogTitle">当天任务</h2>
        </div>
        <button class="icon-button" id="viewerDialogClose" type="button" aria-label="关闭任务弹窗" title="关闭">×</button>
      </div>
      <div class="viewer-dialog-content">
        <img
          class="viewer-dialog-illustration"
          src="./today-card-background-v2.jpg"
          alt="一名男子指向镜头，上方写着在做了再催你自己做的图片"
        />
        <div class="viewer-dialog-details">
          <p class="viewer-dialog-summary" id="viewerDialogSummary"></p>
          <div class="viewer-dialog-list" id="viewerDialogList"></div>
        </div>
      </div>
    </dialog>

    <dialog class="queue-dialog" id="queueDialog" aria-labelledby="queueDialogTitle">
      <div class="queue-dialog-header">
        <div>
          <p class="queue-dialog-kicker">排队取号</p>
          <h2 id="queueDialogTitle">预约最近空闲工作日</h2>
        </div>
        <button class="icon-button" id="queueDialogClose" type="button" aria-label="关闭取号弹窗" title="关闭">×</button>
      </div>

      <form class="queue-form" id="queueForm">
        <label for="queueTaskInput">任务名称</label>
        <textarea id="queueTaskInput" name="taskName" rows="3" maxlength="120" required></textarea>

        <p class="queue-form-status" id="queueFormStatus" role="status" aria-live="polite"></p>
        <button class="queue-submit-button" id="queueSubmitButton" type="submit">确认取号</button>
      </form>
    </dialog>

    <dialog class="queue-list-dialog" id="queueListDialog" aria-labelledby="queueListTitle">
      <div class="queue-list-header">
        <div>
          <p>排队取号</p>
          <h2 id="queueListTitle">排队列表</h2>
        </div>
        <button class="icon-button" id="queueListClose" type="button" aria-label="关闭排队列表" title="关闭">×</button>
      </div>
      <p class="queue-list-summary" id="queueListSummary" aria-live="polite"></p>
      <div class="queue-list" id="queueList"></div>
    </dialog>

    <dialog class="queue-receipt-dialog" id="queueReceiptDialog" aria-labelledby="queueReceiptTitle">
      <button class="queue-receipt-close" id="queueReceiptClose" type="button" aria-label="关闭取号纸" title="关闭">×</button>
      <div class="queue-receipt-banner" id="queueReceiptTitle">取单号</div>
      <p class="queue-receipt-slogan">在做了，再催你自己做。</p>
      <p class="queue-receipt-priority">（官大可插队）</p>
      <div class="queue-receipt-rule" aria-hidden="true"></div>
      <strong class="queue-receipt-number" id="queueReceiptNumber">A1</strong>
      <p class="queue-receipt-success">已成功取号</p>
      <p class="queue-receipt-waiting">您前面还有 <strong id="queueReceiptTaskCount">0</strong> 个任务待处理</p>
      <p class="queue-receipt-estimate">
        请耐心等到 <strong id="queueReceiptDate">待安排</strong><br />
        （估计等待时间 <strong id="queueReceiptDayCount">0</strong> 个工作日）
      </p>
      <div class="queue-receipt-rule" aria-hidden="true"></div>
      <p class="queue-receipt-task" id="queueReceiptTask"></p>
      <div class="queue-receipt-actions">
        <button class="queue-receipt-delete" id="queueReceiptCancel" type="button">取消排队</button>
        <button class="queue-receipt-done" id="queueReceiptDone" type="button">知道了</button>
      </div>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="./queue-config.js"></script>
    <script src="./design-calendar-data.js"></script>
    <script src="./app.js?v=20261023-3"></script>
  </body>
</html>
